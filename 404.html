<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1220">
  <title>404 — CEH Study Reference</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0d1220; color: #f1f5f9; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 10%, #233354 0, #0d1220 58%); }
    main { width: min(100%, 600px); padding: 44px; border: 1px solid #34445f; border-radius: 18px; background: rgba(18,26,43,.94); }
    .label { color: #91b5f5; font: 600 12px/1.5 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(60px, 12vw, 92px); line-height: .95; }
    p { color: #b6c2d4; line-height: 1.7; }
    a { display: inline-block; margin-top: 18px; padding: 11px 16px; border-radius: 8px; background: #5279bb; color: #fff; text-decoration: none; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <div class="label">Study reference / Navigation error</div>
    <h1>404</h1>
    <p>The requested page could not be found. Return to the study dashboard and continue from the module list.</p>
    <a href="/">Back to study dashboard</a>
  </main>
</body>
</html>
