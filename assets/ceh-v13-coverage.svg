<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">CEH v13 curriculum coverage — work in progress</title>
  <desc id="desc">11 of 20 official module headings are represented, or 55 percent. Nine modules are pending. This measures headings represented, not syllabus completion.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="55" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">CEH v13 Curriculum Coverage</text>
  <rect x="726" y="27" width="190" height="34" rx="17" fill="#3d2e00" stroke="#9e6a03"/>
  <circle cx="744" cy="44" r="5" fill="#e3b341"/>
  <text x="758" y="49" fill="#e3b341" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">WORK IN PROGRESS</text>
  <text x="42" y="145" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="67" font-weight="750">11</text>
  <text x="117" y="144" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="500">/ 20</text>
  <text x="43" y="178" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">MODULE HEADINGS REPRESENTED</text>
  <text x="912" y="131" text-anchor="end" fill="#38bdf8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700">55%</text>
  <text x="912" y="155" text-anchor="end" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">9 modules pending</text>
  <rect x="43" y="196" width="874" height="13" rx="6.5" fill="#30363d"/>
  <rect x="43" y="196" width="480.7" height="13" rx="6.5" fill="url(#bar)"/>
  <text x="43" y="237" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">55% counts module headings represented — not syllabus completion or exam readiness.</text>
