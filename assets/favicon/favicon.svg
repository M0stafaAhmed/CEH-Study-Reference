<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Terminal prompt: >_ symbol -->
  <!-- Chevron > -->
  <polyline points="5,10 11,16 5,22" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Underscore cursor -->
  <line x1="14" y1="22" x2="27" y2="22" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Crosshair circle overlay top-right -->
  <circle cx="24" cy="9" r="5" stroke="#c084fc" stroke-width="1.5" fill="none" opacity="0.7"/>
  <line x1="24" y1="4" x2="24" y2="6" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="24" y1="12" x2="24" y2="14" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="19" y1="9" x2="21" y2="9" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="27" y1="9" x2="29" y2="9" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="24" cy="9" r="1.5" fill="#c084fc" opacity="0.9"/>
</svg>
